# OmaSeek's bundle layer.
#
# One row carries the whole family: `omaseek` is a dual-face package, so the
# same name is the Node half (`src/host.js`, the theme and music routes) and —
# through the `dsh.client` declaration in package.json — the browser half
# (`lib/client.js`, the theme registrations, the hero pixel field, the music
# cards). A browser half must be mounted under its bare package name: a
# subpath row like `omaseek/client` resolves to no package root and is read as
# host-only, so the theme table would never reach the page.
#
# Everything a user might want to bend lives in the plugin's own Settings
# sections (OmaSeek / OmaPixel / OmaMusic), not here; a later patch layer in
# `$DSH_HOME/cordis.patch.yml` can still disable the row outright with
# `{ id: omaseek, disabled: true }`.
- insert:
    - id: omaseek
      name: omaseek
